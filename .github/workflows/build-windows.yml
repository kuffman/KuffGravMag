name: Build Windows Application

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Allows you to trigger the build manually

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # A highly stable version for PyInstaller on Windows

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 numpy scipy matplotlib reportlab pyinstaller

    - name: Build Windows Executable
      run: |
        pyinstaller KuffGravMag.spec --noconfirm

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KuffGravMag-Windows
        path: dist/KuffGravMag/