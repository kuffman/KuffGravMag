name: Build Windows Application

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Allows you to trigger the build manually

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up locked uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.9"
        python-version: "3.11.18"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install locked desktop and build dependencies
      run: uv sync --locked --group desktop --group build

    - name: Run scientific regression suite
      run: uv run --locked python -m pytest -q

    - name: Build Windows Executable
      run: |
        if (!(Test-Path -Path "assets")) { New-Item -ItemType Directory -Path "assets" | Out-Null }
        uv run --locked --group desktop --group build pyinstaller KuffGravMag.spec --noconfirm

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KuffGravMag-Windows
        path: dist/KuffGravMag/
